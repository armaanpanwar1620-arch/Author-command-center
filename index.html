<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AETHOR // COMMAND CENTER</title>
    <style>
        :root {
            --bg: #020617;
            --panel: rgba(8, 20, 40, 0.7);
            --border: rgba(0, 240, 255, 0.3);
            --cyan: #00f0ff;
            --cyan-glow: rgba(0, 240, 255, 0.5);
            --white: #f8fafc;
            --text-dim: #64748b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
        }

        body {
            background-color: var(--bg);
            color: var(--white);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 16px;
            overflow: hidden;
            position: relative;
        }

        /* Tactical Background Grid */
        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: 
                radial-gradient(circle at 50% 30%, rgba(0, 240, 255, 0.08) 0%, transparent 70%),
                linear-gradient(rgba(0, 240, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 240, 255, 0.02) 1px, transparent 1px);
            background-size: 100% 100%, 20px 20px, 20px 20px;
            z-index: 1;
            pointer-events: none;
        }

        /* Top Bar */
        .top-bar {
            position: relative;
            z-index: 10;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 10px 14px;
            backdrop-filter: blur(10px);
        }

        .sys-title h1 {
            font-size: 0.9rem;
            letter-spacing: 2px;
            color: var(--cyan);
            font-weight: 700;
        }

        .sys-title span {
            font-size: 0.6rem;
            color: var(--text-dim);
            letter-spacing: 1px;
        }

        .live-clock {
            font-size: 0.85rem;
            color: var(--cyan);
            font-weight: bold;
            letter-spacing: 1px;
        }

        /* Central Arc Core Telemetry */
        .core-section {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 15px 0;
        }

        .arc-core {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: 2px dashed var(--cyan);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.2);
            animation: spinRing 20s linear infinite;
        }

        .core-inner {
            position: absolute;
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: radial-gradient(circle, #ffffff 0%, var(--cyan) 60%, rgba(2,6,23,0.95) 100%);
            box-shadow: 0 0 25px var(--cyan), inset 0 0 10px #fff;
            animation: pulseCore 2s ease-in-out infinite alternate;
        }

        @keyframes spinRing {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes pulseCore {
            from { transform: scale(0.95); box-shadow: 0 0 15px var(--cyan); }
            to { transform: scale(1.05); box-shadow: 0 0 35px var(--cyan); }
        }

        .core-status-text {
            margin-top: 10px;
            font-size: 0.7rem;
            letter-spacing: 2px;
            color: var(--cyan);
            text-transform: uppercase;
        }

        /* Metrics Telemetry Grid */
        .metrics-grid {
            position: relative;
            z-index: 10;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            width: 100%;
        }

        .metric-card {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px;
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 80px;
        }

        .metric-label {
            font-size: 0.6rem;
            color: var(--text-dim);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .metric-value {
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--cyan);
            letter-spacing: 1px;
            margin-top: 4px;
        }

        .metric-sub {
            font-size: 0.55rem;
            color: var(--white);
            opacity: 0.8;
            margin-top: 2px;
        }

        /* Bottom Terminal Status Bar */
        .terminal-bar {
            position: relative;
            z-index: 10;
            width: 100%;
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 0.65rem;
            color: var(--cyan);
            letter-spacing: 1px;
            margin-top: 10px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
    </style>
</head>
<body>

    <!-- TOP HEADER -->
    <header class="top-bar">
        <div class="sys-title">
            <h1>AETHOR // OS</h1>
            <span>ARMAAN'S V15 PRO</span>
        </div>
        <div class="live-clock" id="liveClock">00:00:00</div>
    </header>

    <!-- CENTRAL ARC CORE -->
    <section class="core-section">
        <div class="arc-core">
            <div class="core-inner"></div>
        </div>
        <div class="core-status-text">TELEMETRY LINK ACTIVE</div>
    </section>

    <!-- REAL-TIME METRICS GRID -->
    <section class="metrics-grid">
        <!-- Battery Tracker -->
        <div class="metric-card">
            <div class="metric-label">POWER // BATTERY</div>
            <div class="metric-value" id="batteryVal">--%</div>
            <div class="metric-sub" id="batteryState">Detecting...</div>
        </div>

        <!-- Network Tracker -->
        <div class="metric-card">
            <div class="metric-label">NETWORK // STATUS</div>
            <div class="metric-value" id="netVal">ONLINE</div>
            <div class="metric-sub" id="netType">Checking connection...</div>
        </div>

        <!-- System Memory Estimate -->
        <div class="metric-card">
            <div class="metric-label">HARDWARE // RAM</div>
            <div class="metric-value" id="ramVal">6GB+</div>
            <div class="metric-sub">Vivo V15 Pro Alloc</div>
        </div>

        <!-- Estimated Thermal / CPU Status -->
        <div class="metric-card">
            <div class="metric-label">CORE // THERMAL</div>
            <div class="metric-value" id="tempVal">34.5°C</div>
            <div class="metric-sub">Optimal Range</div>
        </div>
    </section>

    <!-- TERMINAL LOG -->
    <footer class="terminal-bar" id="terminalLog">
        > TELEMETRY INITIALIZED. ALL SENSORS LOCKED.
    </footer>

    <script>
        // 1. Live Clock Updater
        function updateClock() {
            const now = new Date();
            let h = String(now.getHours()).padStart(2, '0');
            let m = String(now.getMinutes()).padStart(2, '0');
            let s = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('liveClock').innerText = `${h}:${m}:${s}`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // 2. Real Battery Telemetry Tracker
        if ('getBattery' in navigator) {
            navigator.getBattery().then(function(battery) {
                function updateBatteryInfo() {
                    let level = Math.round(battery.level * 100);
                    let charging = battery.charging ? "Charging ⚡" : "Discharging";
                    document.getElementById('batteryVal').innerText = level + "%";
                    document.getElementById('batteryState').innerText = charging;
                    
                    if (level <= 20 && !battery.charging) {
                        document.getElementById('terminalLog').innerText = `> WARNING: BATTERY CRITICAL (${level}%)`;
                    }
                }
                updateBatteryInfo();
                battery.addEventListener('levelchange', updateBatteryInfo);
                battery.addEventListener('chargingchange', updateBatteryInfo);
            });
        } else {
            document.getElementById('batteryVal').innerText = "98%";
            document.getElementById('batteryState').innerText = "Stable State";
        }

        // 3. Real Network Connection Tracker
        function updateNetworkStatus() {
            const netVal = document.getElementById('netVal');
            const netType = document.getElementById('netType');
            
            if (navigator.onLine) {
                netVal.innerText = "SECURE";
                let conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
                if (conn) {
                    netType.innerText = (conn.effectiveType ? conn.effectiveType.toUpperCase() : "WIFI") + " // HIGH-SPEED";
                } else {
                    netType.innerText = "CONNECTED // 5G";
                }
            } else {
                netVal.innerText = "OFFLINE";
                netType.innerText = "No Connection";
                document.getElementById('terminalLog').innerText = `> ALERT: NETWORK CONNECTION LOST.`;
            }
        }
        window.addEventListener('online', updateNetworkStatus);
        window.addEventListener('offline', updateNetworkStatus);
        updateNetworkStatus();

        // 4. Estimated Thermal / Hardware Fluctuation Simulation (Real-feel telemetry)
        setInterval(() => {
            let randomTemp = (33.0 + Math.random() * 2.5).toFixed(1);
            document.getElementById('tempVal').innerText = randomTemp + "°C";
        }, 5000);
    </script>
</body>
</html>
